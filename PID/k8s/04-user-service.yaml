apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: slangenglish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: lamisbenhassine/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8011
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/userdbb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: slangenglish
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8011
      targetPort: 8011
