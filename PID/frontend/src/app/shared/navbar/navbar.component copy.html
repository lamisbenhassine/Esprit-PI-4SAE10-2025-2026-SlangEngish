<mat-toolbar [class]="'navbar ' + theme" color="default">
  <!-- Left Section -->
  <div class="navbar-left">
    <button 
      *ngIf="showSidebarToggle"
      mat-icon-button 
      (click)="toggleSidebar()"
      class="sidebar-toggle"
      [matTooltip]="'Toggle Sidebar'">
      <mat-icon>menu</mat-icon>
    </button>
    
    <div class="logo">
<img src="assets/logo1.png" alt="Slang-logo" class="logo-image">
      <span class="logo-text">Slang-English</span>
    </div>
  </div>

  <!-- Center Section - Search Bar -->
  <div class="navbar-center">
    <div class="search-container">
      <mat-icon class="search-icon">search</mat-icon>
      <input 
        type="text" 
        placeholder="Search courses, topics..." 
        class="search-input">
    </div>
  </div>

  <!-- Right Section -->
  <div class="navbar-right">
    <!-- Notifications -->
    <div class="notifications-wrapper" [class.open]="isNotificationsOpen">
      <button
        mat-icon-button
        class="notifications-button"
        (click)="toggleNotifications()"
        [matBadge]="unreadCount"
        matBadgeColor="warn"
        matBadgeHidden="unreadCount === 0"
        matBadgeOverlap="false"
        matTooltip="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>

      <div class="notifications-dropdown" *ngIf="isNotificationsOpen">
        <div class="notifications-header">
          <span>Notifications</span>
          <span class="count" *ngIf="unreadCount > 0">{{ unreadCount }} non lues</span>
        </div>
        <div class="notifications-list" *ngIf="notifications.length > 0; else noNotifications">
          <div class="notification-item" *ngFor="let n of notifications">
            <div class="notification-main">
              <div class="notification-message">{{ n.message }}</div>
              <div class="notification-date">{{ n.createdAt | date:'short' }}</div>
            </div>
            <button mat-stroked-button color="primary" (click)="markAsRead(n)">
              Marquer comme lue
            </button>
          </div>
        </div>
        <ng-template #noNotifications>
          <div class="notifications-empty">
            Aucune nouvelle notification.
          </div>
        </ng-template>
      </div>
    </div>

    <div class="user-profile" [matMenuTriggerFor]="profileMenu">
      <div class="user-info">
        <span class="username">{{ username }}</span>
        <div class="avatar">
          <img [src]="userAvatar || defaultAvatar" [alt]="username">
        </div>
      </div>
      <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
    </div>

    <mat-menu #profileMenu="matMenu" class="profile-menu">
      <button mat-menu-item (click)="onProfile()">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="onSettings()">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
