spring.application.name=user

# Fichier local (mot de passe email) : copiez application-local.properties.example en application-local.properties et remplissez
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/userdbb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Set your MySQL root password here. Leave empty if there is no password.
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8011
# Taille max du corps des requêtes (photo en base64)
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB

# Lien de réinitialisation (page frontend) : le lien dans l'email pointe vers cette URL
app.reset-link-base-url=http://localhost:4200

# reCAPTCHA v2 (« I'm not a robot ») : clé secrète pour la vérification côté serveur
# En dev : utilisez la clé de test Google (toujours valide) ci-dessous. En prod : créez vos clés sur https://www.google.com/recaptcha/admin
app.recaptcha.secret-key=6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe

# SMTP Gmail : envoi du mail de confirmation avec le lien pour réinitialiser le mot de passe
# 1. Remplacez votre-adresse@gmail.com par votre Gmail (ou définissez MAIL_USERNAME)
# 2. Ne mettez JAMAIS le mot de passe en clair ici. Définissez la variable d'environnement MAIL_PASSWORD :
#    - Windows (PowerShell) : $env:MAIL_PASSWORD="votre-mot-de-passe-application"
#    - Windows (CMD)       : set MAIL_PASSWORD=votre-mot-de-passe-application
#    - Puis lancez l'application dans la même fenêtre
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:lamis.benhassine@esprit.tn}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
