<div class="sidebar-container" [@slideInOut]="isCollapsed ? 'closed' : 'open'">
  <div [ngClass]="['sidebar', theme, variant === 'frontoffice' ? 'sidebar-frontoffice' : '']">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <button 
        mat-icon-button 
        (click)="onToggleCollapse()"
        class="collapse-toggle"
        [matTooltip]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'">
        <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
      
      <div class="sidebar-logo" [@fadeInOut]="isCollapsed ? 'hidden' : 'visible'">
        <mat-icon>dashboard</mat-icon>
        <span class="logo-text">Menu</span>
      </div>
    </div>

    <!-- Menu Items (sections + liens avec router) -->
    <div class="sidebar-menu">
      <ng-container *ngFor="let item of menuItems">
        <div
          *ngIf="item.kind === 'section'"
          class="menu-section-title"
          [matTooltip]="isCollapsed ? item.label : ''"
          matTooltipPosition="right">
          <mat-icon *ngIf="item.icon" class="section-icon">{{ item.icon }}</mat-icon>
          <span class="menu-label" [@fadeInOut]="isCollapsed ? 'hidden' : 'visible'">{{ item.label }}</span>
        </div>
        <a
          *ngIf="item.kind !== 'section'"
          [routerLink]="item.routerLink"
          routerLinkActive="active"
          class="menu-item"
          [matTooltip]="isCollapsed ? item.label : ''"
          matTooltipPosition="right">
          <mat-icon
            class="menu-icon"
            [matBadge]="item.badge && item.badge > 0 ? item.badge : null"
            matBadgeSize="small"
            matBadgeColor="warn"
            [matBadgeHidden]="!item.badge || item.badge <= 0">
            {{ item.icon }}
          </mat-icon>
          <span class="menu-label" [@fadeInOut]="isCollapsed ? 'hidden' : 'visible'">{{ item.label }}</span>
        </a>
      </ng-container>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <a
        *ngIf="footerQuickLink"
        [routerLink]="footerQuickLink"
        routerLinkActive="active"
        class="menu-item sidebar-footer-link"
        [matTooltip]="isCollapsed ? footerQuickLabel : ''"
        matTooltipPosition="right">
        <mat-icon
          class="menu-icon"
          [matBadge]="footerQuickBadge && footerQuickBadge > 0 ? footerQuickBadge : null"
          matBadgeSize="small"
          matBadgeColor="warn"
          [matBadgeHidden]="!footerQuickBadge || footerQuickBadge <= 0">
          {{ footerQuickIcon }}
        </mat-icon>
        <span class="menu-label" [@fadeInOut]="isCollapsed ? 'hidden' : 'visible'">{{ footerQuickLabel }}</span>
      </a>
      <div class="footer-item" [@fadeInOut]="isCollapsed ? 'hidden' : 'visible'">
        <mat-icon>info</mat-icon>
        <span class="footer-text">Version 1.0</span>
      </div>
    </div>
  </div>
</div>
