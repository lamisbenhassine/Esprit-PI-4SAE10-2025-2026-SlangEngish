spring.application.name=gateway
server.port=8080

spring.codec.max-in-memory-size=20MB

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# CORS: spring.cloud.gateway.globalcors in application.yml

# Routes defined in GatewayApplication.java
# Smart Notebook: http://localhost:8030 avoids 404 when the service runs locally but is not in Eureka.
# For load-balanced routing: notebook.gateway.uri=lb://notebook
notebook.gateway.uri=http://localhost:8030
