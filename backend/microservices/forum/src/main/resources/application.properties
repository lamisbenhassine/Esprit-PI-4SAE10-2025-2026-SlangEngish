spring.application.name=forum

spring.datasource.url=jdbc:mysql://localhost:3306/forumdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8040

# Microservice user (Feign) — discussions privées : le forum doit joindre ce service pour valider les rôles tuteur/étudiant.
# Sans cette URL, Feign utilise Eureka ; si le serveur Eureka n'est pas démarré, l'ouverture de conversation échoue (503).
user.api.base-url=http://localhost:8010

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB

# Dossier local pour images/vidéos forum (créé au besoin lors du 1er upload)
forum.upload-dir=forum-uploads

# --- AI (Gemini) ---
# Prefer setting FORUM_AI_API_KEY as an environment variable (do not commit real keys).
forum.ai.api-key=${FORUM_AI_API_KEY:}
forum.ai.model=gemini-2.0-flash
forum.ai.max-input-chars=12000
