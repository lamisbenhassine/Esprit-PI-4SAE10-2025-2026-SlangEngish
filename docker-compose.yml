version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: pid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "000000"
      MYSQL_DATABASE: userdbb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p000000"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka:
    build:
      context: ./backend/eureka
    container_name: pid-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka
    depends_on:
      - mysql

  user:
    build:
      context: ./backend/microservices/users
    container_name: pid-user
    restart: unless-stopped
    ports:
      - "8011:8011"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdbb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "000000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "000000"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka

  evaluation:
    build:
      context: ./backend/microservices/evaluation
    container_name: pid-evaluation
    restart: unless-stopped
    ports:
      - "8020:8020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/evaluatiob?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "000000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "000000"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka
      APP_PUBLIC_BASE_URL: http://localhost:8080
      AI_OLLAMA_URL: http://host.docker.internal:11434/v1/chat/completions

  notebook:
    build:
      context: ./backend/microservices/notebook
    container_name: pid-notebook
    restart: unless-stopped
    ports:
      - "8030:8030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notebookdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "000000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "000000"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka
      AI_OLLAMA_URL: http://host.docker.internal:11434/v1/chat/completions

  gateway:
    build:
      context: ./backend/gateway
    container_name: pid-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - user
      - evaluation
      - notebook
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka
      NOTEBOOK_GATEWAY_URI: lb://notebook

volumes:
  mysql-data:
