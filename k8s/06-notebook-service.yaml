apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-service
  namespace: pid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notebook-service
  template:
    metadata:
      labels:
        app: notebook-service
    spec:
      containers:
        - name: notebook-service
          image: lfray/pid-notebook-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8030
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/notebookdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-service
  namespace: pid
spec:
  type: ClusterIP
  selector:
    app: notebook-service
  ports:
    - port: 8030
      targetPort: 8030
